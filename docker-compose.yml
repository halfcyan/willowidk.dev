services:
  webhook:
    build: ./webhook
    ports:
      - "9000:9000"
    volumes:
      - ./site:/var/www:ro
      - ./rebuild.sh:/opt/rebuild.sh:ro
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}

  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro

